name: Perennial Labs
description: >-
  Perennial is an on-chain (EVM) perpetual-derivatives protocol — a composable,
  fully on-chain primitive for permissionless perpetual markets, liquidity
  provisioning (LPs up to 50x), vaults, collateral accounts, and intent-based
  order flow with off-chain solvers. Built by Equilibria and backed by Polychain,
  its developer surface is Solidity smart contracts (MultiInvoker batching) plus
  first-party TypeScript and Python SDKs and a subgraph, rather than a hosted REST
  API. The v2 protocol has been audited by Zellic and Sherlock and runs an Immunefi
  bug-bounty program (up to $500k). The hosted application (perennial.finance) has
  since been sunset, but the protocol contracts, documentation, and SDKs remain
  published.
